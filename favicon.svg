<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f78"/>
      <stop offset="1" stop-color="#160a35"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa6d0"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe6ff"/><stop offset="1" stop-color="#2ec5ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ff0aa"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- soft glow -->
  <circle cx="256" cy="270" r="180" fill="#a78bff" opacity="0.18"/>

  <!-- bottle -->
  <g>
    <!-- glass body (open-mouth bottle) -->
    <path d="M214 118 v40 q0 14 -10 24 q-30 26 -30 66 v150 q0 36 36 36 h92 q36 0 36 -36 v-150 q0 -40 -30 -66 q-10 -10 -10 -24 v-40 z"
          fill="url(#glass)" stroke="#ffffff" stroke-opacity=".5" stroke-width="8"/>
    <!-- liquid, clipped by body via same rounded bottom -->
    <clipPath id="body">
      <path d="M214 118 v40 q0 14 -10 24 q-30 26 -30 66 v150 q0 36 36 36 h92 q36 0 36 -36 v-150 q0 -40 -30 -66 q-10 -10 -10 -24 v-40 z"/>
    </clipPath>
    <g clip-path="url(#body)">
      <rect x="150" y="300" width="212" height="70"  fill="url(#pink)"/>
      <rect x="150" y="370" width="212" height="70"  fill="url(#cyan)"/>
      <rect x="150" y="440" width="212" height="80"  fill="url(#green)"/>
      <!-- top meniscus of pink -->
      <rect x="150" y="292" width="212" height="10" fill="#ffc2e0"/>
      <!-- glass highlight streak -->
      <rect x="196" y="300" width="16" height="210" rx="8" fill="#ffffff" opacity=".45"/>
    </g>
  </g>

  <!-- sparkle -->
  <g fill="#ffe08a">
    <path d="M360 150 q0 26 26 26 q-26 0 -26 26 q0 -26 -26 -26 q26 0 26 -26 z"/>
    <path d="M150 210 q0 16 16 16 q-16 0 -16 16 q0 -16 -16 -16 q16 0 16 -16 z" opacity=".85"/>
  </g>
</svg>
