<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2e78"/>
      <stop offset=".55" stop-color="#5c1656"/>
      <stop offset="1" stop-color="#2c0a30"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="44%" r="52%">
      <stop offset="0" stop-color="#ff9fd6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff9fd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topsheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".25" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9ef"/>
      <stop offset=".34" stop-color="#ff9adb"/>
      <stop offset=".68" stop-color="#ff5fb0"/>
      <stop offset="1" stop-color="#d6299a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffd6ec" stop-opacity=".12"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="body">
      <path d="M441 250 v92 c0 34 -14 40 -44 66 c-30 26 -45 58 -45 104 v210 c0 52 34 82 86 82 h148 c52 0 86 -30 86 -82 v-210 c0 -46 -15 -78 -45 -104 c-30 -26 -44 -32 -44 -66 v-92 z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <rect width="1024" height="1024" fill="url(#topsheen)"/>

  <!-- contact shadow -->
  <ellipse cx="512" cy="838" rx="176" ry="34" fill="#000000" opacity=".38" filter="url(#softer)"/>

  <!-- glass body base -->
  <path d="M441 250 v92 c0 34 -14 40 -44 66 c-30 26 -45 58 -45 104 v210 c0 52 34 82 86 82 h148 c52 0 86 -30 86 -82 v-210 c0 -46 -15 -78 -45 -104 c-30 -26 -44 -32 -44 -66 v-92 z"
        fill="url(#glass)"/>

  <!-- liquid (fills most of the body so the pink-family gradient reads) -->
  <g clip-path="url(#body)">
    <rect x="330" y="452" width="364" height="352" fill="url(#liquid)"/>
    <!-- meniscus -->
    <ellipse cx="512" cy="454" rx="162" ry="15" fill="#ffffff" opacity=".32"/>
    <!-- inner bottom shading for depth -->
    <rect x="330" y="740" width="364" height="170" fill="#000000" opacity=".14" filter="url(#soft)"/>
  </g>

  <!-- glass front: specular streak + rim light -->
  <g clip-path="url(#body)">
    <rect x="404" y="470" width="30" height="300" rx="15" fill="#ffffff" opacity=".55" filter="url(#soft)"/>
    <rect x="452" y="470" width="12" height="250" rx="6" fill="#ffffff" opacity=".32"/>
    <rect x="612" y="440" width="26" height="320" fill="#ffffff" opacity=".10"/>
  </g>

  <!-- crisp glass outline / neck rim -->
  <path d="M441 250 v92 c0 34 -14 40 -44 66 c-30 26 -45 58 -45 104 v210 c0 52 34 82 86 82 h148 c52 0 86 -30 86 -82 v-210 c0 -46 -15 -78 -45 -104 c-30 -26 -44 -32 -44 -66 v-92 z"
        fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="7"/>
  <ellipse cx="512" cy="250" rx="71" ry="13" fill="none" stroke="#ffffff" stroke-opacity=".52" stroke-width="7"/>

  <!-- cute sparkle glints -->
  <path d="M648 452 q0 22 22 22 q-22 0 -22 22 q0 -22 -22 -22 q22 0 22 -22 z" fill="#ffffff" opacity=".9" filter="url(#soft)"/>
  <path d="M648 452 q0 16 16 16 q-16 0 -16 16 q0 -16 -16 -16 q16 0 16 -16 z" fill="#ffffff"/>
  <path d="M366 320 q0 12 12 12 q-12 0 -12 12 q0 -12 -12 -12 q12 0 12 -12 z" fill="#ffffff" opacity=".85"/>
</svg>
