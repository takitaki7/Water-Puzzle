<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0b3a" />
  <title>Water Puzzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars s1"></div>
    <div class="stars s2"></div>
    <div class="glow"></div>
  </div>

  <div id="app">
    <header class="hud">
      <div class="coin-pill">
        <span class="coin"><span class="coin-star">★</span></span>
        <span class="coin-val" id="coinValue">0</span>
      </div>

      <div class="level-pill">Level <span id="levelValue">1</span></div>

      <button class="round-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main class="board-wrap">
      <div id="board" class="board" aria-label="Bottles">
        <canvas id="game"></canvas>
      </div>
    </main>

    <footer class="actions">
      <button class="pw" id="undoBtn" aria-label="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h11a5 5 0 0 1 0 10H9"/><path d="M8 5 4 9l4 4"/></svg>
        <span class="pw-badge" id="undoBadge">0</span>
      </button>
      <button class="pw" id="hintBtn" aria-label="Hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18.5h5"/><path d="M10.5 21.5h3"/><path d="M12 2.5a6.5 6.5 0 0 0-4.2 11.4c.8.7 1.2 1.2 1.2 2.6h6c0-1.4.4-1.9 1.2-2.6A6.5 6.5 0 0 0 12 2.5z"/></svg>
        <span class="pw-badge" id="hintBadge">0</span>
      </button>
      <button class="pw" id="addTubeBtn" aria-label="Add bottle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h3"/><path d="M9.5 2.5v3l-1.2 1.7A3 3 0 0 0 7.8 9v9.5a3 3 0 0 0 3 3h.4a3 3 0 0 0 3-3V9a3 3 0 0 0-.5-1.8L12.5 5.5v-3"/><path d="M19 3.5v5M21.5 6h-5"/></svg>
        <span class="pw-badge" id="addBadge">0</span>
      </button>
    </footer>
  </div>

  <!-- Level complete -->
  <div id="winOverlay" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="win-card">
      <div class="win-stars" id="stars">
        <span class="win-star">★</span><span class="win-star mid">★</span><span class="win-star">★</span>
      </div>
      <div class="win-ribbon">LEVEL CLEAR</div>
      <h2 class="win-title">Well done!</h2>
      <p class="win-sub" id="winSub"></p>
      <div class="win-coins"><span class="coin sm"><span class="coin-star">★</span></span> <b id="winCoins">+50</b></div>
      <button class="btn primary wide" id="nextLevelBtn">Next ➜</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h3 class="modal-title">Settings</h3>
      <button class="row-btn" id="soundToggle"><span>Sound</span><span class="row-val" id="soundState">On</span></button>
      <button class="row-btn" id="restartLevelBtn"><span>Restart level</span><span class="row-ic">⟳</span></button>
      <button class="btn primary wide" id="closeSettings">Close</button>
    </div>
  </div>

  <!-- Rewarded ad (simulated) -->
  <div id="adModal" class="modal hidden">
    <div class="ad-card">
      <div class="ad-badge">AD</div>
      <div class="ad-visual">
        <div class="ad-icon" id="adIcon">💡</div>
        <div class="ad-headline" id="adHeadline">Watch a video</div>
        <div class="ad-reward" id="adReward">Reward: +1 Hint</div>
      </div>
      <div class="ad-progress"><div class="ad-progress-fill" id="adFill"></div></div>
      <div class="ad-status" id="adStatus">Reward in 3…</div>
      <button class="btn primary wide hidden" id="adClaim">Claim reward</button>
      <button class="ad-x" id="adClose" aria-label="Close">✕</button>
    </div>
  </div>

  <script src="game.js?v=5"></script>
</body>
</html>
