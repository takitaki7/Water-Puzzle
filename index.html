<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3a0f3a" />
  <title>PuruPop — pour, sort &amp; pop the potions</title>
  <meta name="description" content="Pour and sort the colorful potions into matching bottles, then watch them go purupun and pop! A relaxing, free color-sorting puzzle you can play right in your browser." />

  <!-- Icons / PWA -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PuruPop" />

  <!-- Social share (Open Graph / Twitter). Paths are relative; when the
       custom domain is set you may hardcode absolute URLs for best previews. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PuruPop — pour, sort &amp; pop the potions" />
  <meta property="og:description" content="Sort the colorful potions and watch them go purupun and pop. Play free in your browser." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PuruPop — pour, sort &amp; pop the potions" />
  <meta name="twitter:description" content="Sort the colorful potions and watch them go purupun and pop. Play free in your browser." />
  <meta name="twitter:image" content="/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=22" />

  <!-- Optional analytics / error monitoring — inert until configured.
       Fill in a real GA4 Measurement ID / Sentry DSN to turn these on;
       leave blank and analytics.js makes zero network requests. -->
  <script>
    window.PURUPOP_CONFIG = {
      gaId: "",       // e.g. "G-XXXXXXXXXX" from Google Analytics
      sentryDsn: "",  // e.g. "https://xxxx@xxxx.ingest.sentry.io/xxxx" from Sentry

      // Rewarded ads. Pick ONE provider — they are mutually exclusive:
      //   "poki"  → web portal build. Poki sells the ads and pays a
      //             revenue share; their terms forbid a third-party ad
      //             network in the game, so do NOT also set AdMob.
      //   "admob" → native (iOS/Android) build only. AdMob cannot serve
      //             a page opened in a browser.
      //   ""      → no network; the built-in simulated ad is used.
      // See ads.js and the README.
      ads: {
        provider: "",     // "poki" | "admob" | ""
        testMode: false,  // Poki debug mode / Google's public test unit

        // AdMob only:
        rewardedUnitIds: {
          undo: "",       // e.g. "ca-app-pub-XXXXXXXX/XXXXXXXX"
          hint: "",
          add: "",
        },

        // Poki only: override if Poki gives you a game-specific SDK URL.
        pokiSdkUrl: "",
      },
    };
  </script>
  <script src="analytics.js?v=1" defer></script>
  <script src="ads.js?v=2"></script>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars s1"></div>
    <div class="stars s2"></div>
    <div class="glow"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <div id="app">
    <header class="hud">
      <button class="coin-pill" id="coinPill" aria-label="Shop">
        <span class="coin"><span class="coin-star">★</span></span>
        <span class="coin-val" id="coinValue">0</span>
        <span class="coin-plus">＋</span>
      </button>

      <div class="level-pill" id="levelPill">Level <span id="levelValue">1</span></div>

      <button class="round-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main class="board-wrap">
      <div id="board" class="board" aria-label="Bottles">
        <canvas id="game"></canvas>
      </div>
      <div id="levelLoading" class="level-loading hidden" aria-hidden="true">
        <span class="level-loading-spin"></span>
        <span>Mixing potions…</span>
      </div>
    </main>

    <footer class="actions">
      <button class="pw" id="undoBtn" aria-label="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h11a5 5 0 0 1 0 10H9"/><path d="M8 5 4 9l4 4"/></svg>
        <span class="pw-badge" id="undoBadge">0</span>
      </button>
      <button class="pw" id="hintBtn" aria-label="Hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18.5h5"/><path d="M10.5 21.5h3"/><path d="M12 2.5a6.5 6.5 0 0 0-4.2 11.4c.8.7 1.2 1.2 1.2 2.6h6c0-1.4.4-1.9 1.2-2.6A6.5 6.5 0 0 0 12 2.5z"/></svg>
        <span class="pw-badge" id="hintBadge">0</span>
      </button>
      <button class="pw" id="addTubeBtn" aria-label="Add bottle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h3"/><path d="M9.5 2.5v3l-1.2 1.7A3 3 0 0 0 7.8 9v9.5a3 3 0 0 0 3 3h.4a3 3 0 0 0 3-3V9a3 3 0 0 0-.5-1.8L12.5 5.5v-3"/><path d="M19 3.5v5M21.5 6h-5"/></svg>
        <span class="pw-badge" id="addBadge">0</span>
      </button>
    </footer>
  </div>

  <!-- Level complete -->
  <div id="winOverlay" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="win-card">
      <div class="win-stars" id="stars">
        <span class="win-star">★</span><span class="win-star mid">★</span><span class="win-star">★</span>
      </div>
      <div class="win-ribbon">LEVEL CLEAR</div>
      <h2 class="win-title">Well done!</h2>
      <p class="win-sub" id="winSub"></p>
      <div class="win-coins"><span class="coin sm"><span class="coin-star">★</span></span> <b id="winCoins">+50</b></div>
      <button class="btn primary wide" id="nextLevelBtn">Next ➜</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h3 class="modal-title">Settings</h3>
      <button class="row-btn" id="soundToggle"><span>Sound effects</span><span class="toggle on" id="soundToggleSwitch"><span class="toggle-knob"></span></span></button>
      <button class="row-btn" id="musicToggle"><span>Music</span><span class="toggle on" id="musicToggleSwitch"><span class="toggle-knob"></span></span></button>
      <button class="row-btn" id="restartLevelBtn"><span>Restart level</span><span class="row-ic">⟳</span></button>
      <!-- tokushoho.html (Japan's Act on Specified Commercial Transactions
           notice) is intentionally not linked while purchases are off; it
           only becomes legally required once real payments ship. -->
      <div class="legal-links">
        <a href="terms.html" target="_blank" rel="noopener">Terms</a><span>·</span>
        <a href="privacy.html" target="_blank" rel="noopener">Privacy</a>
      </div>
      <button class="btn primary wide" id="closeSettings">Close</button>
    </div>
  </div>

  <!-- Shop: buy power-ups with coins anytime -->
  <div id="shopModal" class="modal hidden">
    <div class="modal-card shop-card">
      <button class="ad-x" id="shopClose" aria-label="Close">✕</button>
      <h3 class="modal-title">Shop</h3>
      <div class="store-balance">Balance <span class="coin xs"><span class="coin-star">★</span></span> <b id="shopCoins">0</b></div>
      <div class="soon-banner" id="shopSoonBanner">🚧 Spending coins is coming soon — keep earning, your balance is saved.</div>
      <div class="shop-list">
        <div class="shop-item">
          <span class="shop-ic undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h11a5 5 0 0 1 0 10H9"/><path d="M8 5 4 9l4 4"/></svg></span>
          <span class="shop-info"><b>Undo</b><small>Owned: <span id="ownUndo">0</span></small></span>
          <button class="shop-buy" id="buyUndo"><span class="coin xs"><span class="coin-star">★</span></span> <span id="priceUndo">60</span></button>
        </div>
        <div class="shop-item">
          <span class="shop-ic hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18.5h5"/><path d="M10.5 21.5h3"/><path d="M12 2.5a6.5 6.5 0 0 0-4.2 11.4c.8.7 1.2 1.2 1.2 2.6h6c0-1.4.4-1.9 1.2-2.6A6.5 6.5 0 0 0 12 2.5z"/></svg></span>
          <span class="shop-info"><b>Hint</b><small>Owned: <span id="ownHint">0</span></small></span>
          <button class="shop-buy" id="buyHint"><span class="coin xs"><span class="coin-star">★</span></span> <span id="priceHint">90</span></button>
        </div>
        <div class="shop-item">
          <span class="shop-ic add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h3"/><path d="M9.5 2.5v3l-1.2 1.7A3 3 0 0 0 7.8 9v9.5a3 3 0 0 0 3 3h.4a3 3 0 0 0 3-3V9a3 3 0 0 0-.5-1.8L12.5 5.5v-3"/><path d="M19 3.5v5M21.5 6h-5"/></svg></span>
          <span class="shop-info"><b>+ Bottle</b><small>Owned: <span id="ownAdd">0</span></small></span>
          <button class="shop-buy" id="buyAdd"><span class="coin xs"><span class="coin-star">★</span></span> <span id="priceAdd">140</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Get more power-ups (watch ad OR spend coins) -->
  <div id="storeModal" class="modal hidden">
    <div class="modal-card store-card">
      <button class="ad-x" id="storeClose" aria-label="Close">✕</button>
      <div class="store-icon" id="storeIcon"></div>
      <h3 class="modal-title" id="storeTitle">Get more Hints</h3>
      <div class="store-opts">
        <button class="store-opt watch" id="storeWatch">
          <span class="so-ic">▶</span>
          <span class="so-txt"><b>Watch ad</b><small>Free · +1</small></span>
        </button>
        <button class="store-opt buy" id="storeBuy">
          <span class="so-ic"><span class="coin xs"><span class="coin-star">★</span></span></span>
          <span class="so-txt"><b id="storeBuyPrice">Buy · 80</b><small id="storeBuyNote">+1</small></span>
        </button>
      </div>
      <div class="store-balance">Balance <span class="coin xs"><span class="coin-star">★</span></span> <b id="storeCoins">0</b></div>
    </div>
  </div>

  <!-- Rewarded ad (simulated) -->
  <div id="adModal" class="modal hidden">
    <div class="ad-card">
      <div class="ad-badge">AD</div>
      <div class="ad-visual">
        <div class="ad-icon" id="adIcon"></div>
        <div class="ad-headline" id="adHeadline">Watch a video</div>
        <div class="ad-reward" id="adReward">Reward: +1 Hint</div>
      </div>
      <div class="ad-progress"><div class="ad-progress-fill" id="adFill"></div></div>
      <div class="ad-status" id="adStatus">Reward in 3…</div>
      <button class="btn primary wide hidden" id="adClaim">Claim reward</button>
      <button class="ad-x" id="adClose" aria-label="Close">✕</button>
    </div>
  </div>

  <script src="game.js?v=23"></script>
</body>
</html>
